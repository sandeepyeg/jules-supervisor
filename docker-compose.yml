version: '3.8'

services:
  app:
    build: .
    container_name: jules-supervisor-app
    restart: always
    ports:
      - '8084:8084'
    volumes:
      - ./.env:/app/.env
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: jules-supervisor-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: jules_supervisor
      MYSQL_USER: ${DB_USER:-supervisor}
      MYSQL_PASSWORD: ${DB_PASS:-supervisorpassword}
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

