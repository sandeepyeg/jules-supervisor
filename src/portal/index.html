<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jules Supervisor Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16, #02040a);
      --glass-bg: rgba(22, 28, 45, 0.45);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-glow: rgba(99, 102, 241, 0.1);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      /* Colors */
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
      --primary-glow: rgba(99, 102, 241, 0.3);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.25);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.25);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.25);
      --info: #06b6d4;
      --info-glow: rgba(6, 182, 212, 0.25);
      --neutral: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      padding: 1rem;
    }

    h1, h2, h3, h4 {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(9, 13, 22, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.5);
    }

    /* Container Grid */
    .dashboard-container {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    /* Header */
    .header-row {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 0.5rem 0 1.25rem 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .logo-area h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #a5b4fc, #e9d5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
    }

    .logo-area p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .security-panel {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--glass-border);
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
      width: 100%;
    }

    .security-panel label {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Mobile Tabs Navigation */
    .mobile-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 0.5rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* Desktop Columns display overrides */
    @media (min-width: 1024px) {
      .dashboard-container {
        grid-template-columns: 1.1fr 0.9fr;
      }
      .header-row {
        grid-column: span 2;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
      .security-panel {
        width: auto;
      }
      .mobile-tabs {
        display: none !important;
      }
      .dashboard-panel {
        display: block !important;
      }
    }

    /* Form & Input Styles */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, textarea, select {
      background: rgba(9, 13, 22, 0.6);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.15);
    }

    .btn {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: rgba(71, 85, 105, 0.15);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      box-shadow: none;
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #dc2626);
      box-shadow: 0 4px 12px var(--danger-glow);
    }

    /* Glass Cards */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 1.25rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 0.5rem;
    }

    /* Dynamic Form Builders */
    .editor-section {
      background: rgba(9, 13, 22, 0.3);
      border: 1px dashed var(--glass-border);
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
    }

    .editor-item {
      background: rgba(30, 41, 59, 0.2);
      border: 1px solid var(--glass-border);
      padding: 0.85rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      position: relative;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .item-number {
      font-size: 0.85rem;
      font-weight: 600;
      color: #818cf8;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
    }

    .checkbox-item input[type="checkbox"] {
      width: auto;
      height: auto;
      cursor: pointer;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .badge-draft { background: rgba(100, 116, 139, 0.2); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.4); }
    .badge-queued { background: rgba(100, 116, 139, 0.15); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }
    .badge-running {
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
      box-shadow: 0 0 8px var(--info-glow);
      animation: pulse 2s infinite;
    }
    .badge-waiting_answer {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 8px var(--warning-glow);
      animation: pulse 1.5s infinite;
    }
    .badge-pr_open { background: rgba(139, 92, 246, 0.15); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-merged { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-failed { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-skipped { background: rgba(148, 163, 184, 0.1); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.2); }

    /* Active Phase Controls */
    .active-phase-header {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.15);
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
    }

    .active-phase-header h3 {
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
    }

    .phase-metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .phase-metadata strong {
      color: var(--text-main);
    }

    .task-status-card {
      background: rgba(30, 41, 59, 0.15);
      border: 1px solid var(--glass-border);
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    @media (min-width: 640px) {
      .task-status-card {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .task-status-info h4 {
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .task-status-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .task-status-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .pr-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .pr-link:hover {
      text-decoration: underline;
    }

    /* Q&A Logs */
    .qalog-list {
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .qalog-card {
      background: rgba(9, 13, 22, 0.4);
      border: 1px solid var(--glass-border);
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .qalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .qalog-question {
      font-style: italic;
      color: #f1f5f9;
      border-left: 2px solid var(--primary);
      padding-left: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .qalog-answer {
      color: #cbd5e1;
    }

    .qalog-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      margin-top: 0.4rem;
      color: var(--text-muted);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Top Header -->
    <div class="header-row">
      <div class="logo-area">
        <h1>Jules Supervisor</h1>
        <p>Coordinate phases, execute Jules sessions, and verify PRs</p>
      </div>
      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;" class="header-controls">
        <div class="security-panel" style="width: auto; gap: 0.4rem;">
          <label for="phase-selector">Load Phase:</label>
          <select id="phase-selector" onchange="onPhaseSelect(this.value)" style="width: 160px; padding: 0.35rem 0.5rem; font-size: 0.8rem; border-radius: 6px; background: rgba(9, 13, 22, 0.6); color: var(--text-main); border: 1px solid var(--glass-border);">
            <option value="">-- Load Phase --</option>
          </select>
        </div>
        <div class="security-panel" style="width: auto;">
          <label for="portal-secret-input">Portal Key:</label>
          <input type="password" id="portal-secret-input" placeholder="Secret Key" style="width: 110px; padding: 0.35rem 0.6rem; font-size: 0.8rem; border-radius: 6px;">
        </div>
      </div>
    </div>

    <!-- Mobile Tabs Selector -->
    <div class="mobile-tabs">
      <button class="tab-btn active" id="tab-setup" onclick="showTab('setup')">📝 Setup Phase</button>
      <button class="tab-btn" id="tab-status" onclick="showTab('status')">📊 Live Monitor</button>
      <button class="tab-btn" id="tab-logs" onclick="showTab('logs')">💬 QA Logs</button>
    </div>

    <!-- COLUMN 1: Setup Panel or Active Controller -->
    <div class="dashboard-panel" id="panel-left">
      
      <!-- SETUP PHASE PANEL -->
      <div id="phase-creation-card" class="glass-card">
        <div class="card-title">
          <h2>Create Running Phase</h2>
        </div>
        
        <form id="phase-form">
          <div class="form-group">
            <label for="phase-title">Phase Title</label>
            <input type="text" id="phase-title" required placeholder="e.g. Phase 1 - Database Refactoring">
          </div>

          <div class="form-group">
            <label for="main-branch">Base Branch</label>
            <input type="text" id="main-branch" value="main" required placeholder="e.g. main">
          </div>

          <div class="form-group">
            <label for="phase-description">Phase Description & Guidelines (AI Context)</label>
            <textarea id="phase-description" placeholder="Write phase targets, architectural rules, and API specifications. All tasks will inherit this description as context." rows="4" required></textarea>
          </div>

          <!-- Tasks List Section -->
          <div class="editor-section">
            <h3 style="margin-bottom: 0.5rem; font-size: 1rem; display: flex; justify-content: space-between; align-items: center;">
              Phase Tasks
              <button type="button" class="btn btn-secondary" style="padding: 0.25rem 0.6rem; font-size: 0.75rem;" onclick="addTaskItem()">+ Add Task</button>
            </h3>
            <div id="tasks-container">
              <!-- Dynamically populated. Defaults to 1 task -->
            </div>
          </div>

          <button type="submit" class="btn" style="width: 100%; font-size: 1rem; padding: 0.8rem;">
            Save & Prepare Phase Draft
          </button>
        </form>
      </div>

      <!-- ACTIVE MONITOR CONTROL PANEL -->
      <div id="phase-active-card" class="glass-card" style="display: none;">
        <div class="card-title">
          <h2>Active Controls</h2>
          <button class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;" onclick="resetToDraft()">New Phase</button>
        </div>

        <div class="active-phase-header">
          <h3 id="active-phase-title">Phase Name</h3>
          <div class="phase-metadata" style="margin-top: 0.25rem;">
            <div>Status: <strong id="active-phase-status" class="badge">DRAFT</strong></div>
            <div>Branch: <strong id="active-phase-branch">N/A</strong></div>
          </div>
        </div>

        <div id="start-phase-area" style="margin-bottom: 1.5rem;">
          <button class="btn" id="start-phase-btn" onclick="startPhase()" style="width: 100%; font-size: 1rem; padding: 0.8rem;">
            🚀 Start Phase & Launch Sessions
          </button>
        </div>

        <div style="font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.4rem;">
          Tasks Sequence
        </div>
        <div id="active-tasks-list">
          <!-- Populated by poller -->
        </div>
      </div>

    </div>

    <!-- COLUMN 2: Status & QA Log -->
    <div class="dashboard-panel" id="panel-right" style="display: flex; flex-direction: column; gap: 1.5rem;">
      
      <!-- STATUS HEALTH BOARD -->
      <div class="glass-card">
        <div class="card-title">
          <h2>Live Monitoring</h2>
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <div style="flex: 1; background: rgba(9, 13, 22, 0.4); padding: 0.85rem; border-radius: 10px; text-align: center; border: 1px solid var(--glass-border);">
            <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Telegram Alerts</div>
            <div id="escalation-count-box" style="font-size: 1.8rem; font-weight: 700; color: var(--warning); margin: 0.2rem 0;">0</div>
            <div id="escalation-reminder-text" style="font-size: 0.7rem; color: var(--text-muted); display: none;">Awaiting reply</div>
          </div>
          <div style="flex: 1; background: rgba(9, 13, 22, 0.4); padding: 0.85rem; border-radius: 10px; text-align: center; border: 1px solid var(--glass-border);">
            <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Supervisor Status</div>
            <div id="polling-health-box" style="font-size: 0.95rem; font-weight: 600; color: var(--neutral); margin-top: 0.8rem;">OFFLINE</div>
          </div>
        </div>
      </div>

      <!-- QA LOG PANEL -->
      <div class="glass-card" id="panel-logs-card">
        <div class="card-title">
          <h2>Question Log</h2>
        </div>
        <div id="qalog-empty-message" style="color: var(--text-muted); text-align: center; padding: 1.5rem 0; font-size: 0.85rem;">
          No questions logged yet.
        </div>
        <div class="qalog-list" id="qalog-list">
          <!-- Dynamically populated -->
        </div>
      </div>

    </div>

  </div>

  <script>
    let tasksList = [];
    let activePhaseId = null;
    let pollInterval = null;
    let qaInterval = null;
    let activeTab = 'setup';

    // Secret Key config setup
    const secretInput = document.getElementById('portal-secret-input');
    const savedSecret = localStorage.getItem('jules_supervisor_secret');
    if (savedSecret) {
      secretInput.value = savedSecret;
    }
    secretInput.addEventListener('input', () => {
      localStorage.setItem('jules_supervisor_secret', secretInput.value);
    });

    const getHeaders = () => {
      const headers = { 'Content-Type': 'application/json' };
      if (secretInput.value) {
        headers['x-portal-key'] = secretInput.value;
      }
      return headers;
    };

    // Mobile View tab controller
    function showTab(tab) {
      activeTab = tab;
      
      const tabSetup = document.getElementById('tab-setup');
      const tabStatus = document.getElementById('tab-status');
      const tabLogs = document.getElementById('tab-logs');

      tabSetup.classList.remove('active');
      tabStatus.classList.remove('active');
      tabLogs.classList.remove('active');

      const panelLeft = document.getElementById('panel-left');
      const panelRight = document.getElementById('panel-right');
      const panelLogsCard = document.getElementById('panel-logs-card');

      if (tab === 'setup') {
        tabSetup.classList.add('active');
        panelLeft.style.display = 'block';
        panelRight.style.display = 'none';
      } else if (tab === 'status') {
        tabStatus.classList.add('active');
        panelLeft.style.display = 'none';
        panelRight.style.display = 'flex';
        panelLogsCard.style.display = 'none'; // hide log inside column 2
      } else if (tab === 'logs') {
        tabLogs.classList.add('active');
        panelLeft.style.display = 'none';
        panelRight.style.display = 'flex';
        panelLogsCard.style.display = 'block';
      }
    }

    // Adjust UI displaying rules based on screen resize
    function checkViewport() {
      if (window.innerWidth >= 1024) {
        document.getElementById('panel-left').style.display = 'block';
        document.getElementById('panel-right').style.display = 'flex';
        document.getElementById('panel-logs-card').style.display = 'block';
      } else {
        showTab(activeTab);
      }
    }
    window.addEventListener('resize', checkViewport);
    window.addEventListener('load', () => {
      loadFormDraft();
      checkViewport();
    });

    // Save/Restore draft progress
    const saveFormDraft = () => {
      const draft = {
        title: document.getElementById('phase-title').value,
        description: document.getElementById('phase-description').value,
        mainBranch: document.getElementById('main-branch').value,
        tasks: tasksList
      };
      localStorage.setItem('jules_phase_draft', JSON.stringify(draft));
    };

    const loadFormDraft = () => {
      const raw = localStorage.getItem('jules_phase_draft');
      if (raw) {
        try {
          const draft = JSON.parse(raw);
          document.getElementById('phase-title').value = draft.title || '';
          document.getElementById('phase-description').value = draft.description || '';
          document.getElementById('main-branch').value = draft.mainBranch || 'main';
          
          tasksList = draft.tasks || [];
          
          if (tasksList.length === 0) {
            addTaskItem(); // Defaults to 1 task
          } else {
            renderTasks();
          }
        } catch (e) {
          console.error(e);
          addTaskItem();
        }
      } else {
        addTaskItem(); // Defaults to 1 task
      }
    };

    // --- TASK EDITOR LOGIC ---
    function addTaskItem() {
      tasksList.push({
        id: 't_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        title: '',
        description: '',
        mode: 'ai_assisted',
        jules_notes: '',
        depends_on: []
      });
      renderTasks();
      saveFormDraft();
    }

    function removeTaskItem(index) {
      if (tasksList.length <= 1) {
        alert('You must have at least one task in the phase.');
        return;
      }
      tasksList.splice(index, 1);
      renderTasks();
      saveFormDraft();
    }

    function onTaskChange(index, field, value) {
      tasksList[index][field] = value;
      saveFormDraft();
    }

    function onTaskCheckboxChange(taskIdx, field, value, checked) {
      const list = tasksList[taskIdx][field];
      if (checked) {
        if (!list.includes(value)) list.push(value);
      } else {
        const idx = list.indexOf(value);
        if (idx !== -1) list.splice(idx, 1);
      }
      saveFormDraft();
    }

    function updateDependenciesLists() {
      // Refresh user input strings on state before rendering checkboxes
      tasksList.forEach((t) => {
        const titleEl = document.getElementById(`t-title-${t.id}`);
        const descEl = document.getElementById(`t-desc-${t.id}`);
        const notesEl = document.getElementById(`t-notes-${t.id}`);
        if (titleEl) t.title = titleEl.value;
        if (descEl) t.description = descEl.value;
        if (notesEl) t.jules_notes = notesEl.value;
      });
      renderTasks();
    }

    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';

      tasksList.forEach((task, idx) => {
        const item = document.createElement('div');
        item.className = 'editor-item';
        
        // Build dependencies checklist
        let dependencyCheckboxes = '';
        tasksList.forEach((otherTask, oIdx) => {
          if (oIdx === idx) return;
          const otherTitle = otherTask.title || `Task #${oIdx + 1}`;
          const checked = task.depends_on.includes(otherTask.id) ? 'checked' : '';
          dependencyCheckboxes += `
            <label class="checkbox-item">
              <input type="checkbox" value="${otherTask.id}" ${checked} onchange="onTaskCheckboxChange(${idx}, 'depends_on', this.value, this.checked)">
              ${otherTitle}
            </label>
          `;
        });

        item.innerHTML = `
          <div class="item-header">
            <span class="item-number">Task #${idx + 1}</span>
            <button type="button" class="btn btn-secondary btn-danger" style="padding: 0.15rem 0.45rem; font-size: 0.7rem;" onclick="removeTaskItem(${idx})">Delete</button>
          </div>
          
          <div class="form-group">
            <label>Task Title</label>
            <input type="text" id="t-title-${task.id}" placeholder="e.g. Implement db connection wrapper" value="${task.title}" oninput="onTaskChange(${idx}, 'title', this.value); updateDependenciesLists();" required>
          </div>

          <div class="form-group">
            <label>Description / Prompt instructions for Jules</label>
            <textarea id="t-desc-${task.id}" placeholder="Specify coding tasks..." rows="2" oninput="onTaskChange(${idx}, 'description', this.value)" required>${task.description}</textarea>
          </div>

          <div class="form-group">
            <label>Supervisor Mode</label>
            <select onchange="onTaskChange(${idx}, 'mode', this.value)">
              <option value="ai_assisted" ${task.mode === 'ai_assisted' ? 'selected' : ''}>AI-Assisted (Auto Answer)</option>
              <option value="manual" ${task.mode === 'manual' ? 'selected' : ''}>Manual (Escalate to Telegram)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Additional Notes for Jules (e.g. code templates, styling rules)</label>
            <textarea id="t-notes-${task.id}" placeholder="Optional" rows="1" oninput="onTaskChange(${idx}, 'jules_notes', this.value)">${task.jules_notes || ''}</textarea>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label>Depends on prior tasks</label>
            <div class="checkbox-grid">
              ${dependencyCheckboxes || '<span style="font-size: 0.75rem; color: var(--text-muted);">No other tasks in phase list</span>'}
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // --- FORM SUBMIT (CREATE PHASE) ---
    document.getElementById('phase-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Read final input values
      tasksList.forEach((t) => {
        const titleEl = document.getElementById(`t-title-${t.id}`);
        const descEl = document.getElementById(`t-desc-${t.id}`);
        const notesEl = document.getElementById(`t-notes-${t.id}`);
        if (titleEl) t.title = titleEl.value;
        if (descEl) t.description = descEl.value;
        if (notesEl) t.jules_notes = notesEl.value;
      });

      const body = {
        title: document.getElementById('phase-title').value,
        description: document.getElementById('phase-description').value,
        mainBranch: document.getElementById('main-branch').value,
        tasks: tasksList
      };

      try {
        const response = await fetch('/api/phases', {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          const err = await response.json();
          alert('Error creating phase: ' + (err.error || response.statusText));
          return;
        }

        const data = await response.json();
        activePhaseId = data.phaseId;
        
        // Hide config, show active controls
        document.getElementById('phase-creation-card').style.display = 'none';
        document.getElementById('phase-active-card').style.display = 'block';

        // Load running panels
        loadActivePhase();
        
        // Auto-switch mobile view tab to Status
        if (window.innerWidth < 1024) {
          showTab('status');
        }
      } catch (err) {
        console.error(err);
        alert('Network error creating phase: ' + err.message);
      }
    });

    // --- ACTIVE PHASE BOARD MONITOR ---
    async function loadActivePhase() {
      if (!activePhaseId) return;

      try {
        const response = await fetch(`/api/phases/${activePhaseId}`, {
          headers: getHeaders()
        });
        if (!response.ok) return;

        const phase = await response.json();
        
        document.getElementById('active-phase-title').innerText = phase.title;
        const statusBadge = document.getElementById('active-phase-status');
        statusBadge.innerText = phase.status;
        statusBadge.className = 'badge';
        statusBadge.classList.add(`badge-${phase.status}`);

        document.getElementById('active-phase-branch').innerText = phase.phase_branch || 'N/A (Draft)';
        
        const startArea = document.getElementById('start-phase-area');
        if (phase.status === 'draft') {
          startArea.style.display = 'block';
        } else {
          startArea.style.display = 'none';
        }

        // Poll statuses immediately
        await pollStatus();
        
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(pollStatus, 10000);
        document.getElementById('polling-health-box').innerText = 'RUNNING (10s)';
        document.getElementById('polling-health-box').style.color = 'var(--success)';

        await updateQALog();
        if (qaInterval) clearInterval(qaInterval);
        qaInterval = setInterval(updateQALog, 10000);

      } catch (err) {
        console.error(err);
      }
    }

    async function startPhase() {
      const btn = document.getElementById('start-phase-btn');
      btn.disabled = true;
      btn.innerText = 'Starting...';

      try {
        const response = await fetch(`/api/phases/${activePhaseId}/start`, {
          method: 'POST',
          headers: getHeaders()
        });

        if (!response.ok) {
          const err = await response.json();
          alert('Error starting phase: ' + (err.error || response.statusText));
          btn.disabled = false;
          btn.innerText = '🚀 Start Phase & Launch Sessions';
          return;
        }

        await loadActivePhase();
      } catch (err) {
        console.error(err);
        alert('Failed to start phase: ' + err.message);
        btn.disabled = false;
        btn.innerText = '🚀 Start Phase & Launch Sessions';
      }
    }

    async function pollStatus() {
      if (!activePhaseId) return;

      try {
        const response = await fetch(`/api/status/${activePhaseId}`, {
          headers: getHeaders()
        });
        if (!response.ok) return;

        const data = await response.json();
        
        const statusBadge = document.getElementById('active-phase-status');
        statusBadge.innerText = data.phase.status;
        statusBadge.className = 'badge';
        statusBadge.classList.add(`badge-${data.phase.status}`);

        document.getElementById('active-phase-branch').innerText = data.phase.phase_branch || 'N/A';

        // Update escalation notification
        document.getElementById('escalation-count-box').innerText = data.unresolvedPendingCount;
        if (data.unresolvedPendingCount > 0) {
          document.getElementById('escalation-count-box').style.color = 'var(--warning)';
          document.getElementById('escalation-reminder-text').style.display = 'block';
        } else {
          document.getElementById('escalation-count-box').style.color = 'var(--neutral)';
          document.getElementById('escalation-reminder-text').style.display = 'none';
        }

        // Render statuses
        const listContainer = document.getElementById('active-tasks-list');
        listContainer.innerHTML = '';

        data.tasks.forEach(task => {
          const card = document.createElement('div');
          card.className = 'task-status-card';
          
          let actionContent = '';
          if (task.pr_url) {
            actionContent = `<a href="${task.pr_url}" target="_blank" class="pr-link">PR #${task.pr_url.split('/').pop()} ↗</a>`;
          }

          let retryContent = '';
          if (task.retry_count > 0) {
            retryContent = `<span style="font-size: 0.75rem; color: var(--danger); font-weight: 500; margin-left: 0.25rem;">(Retry: ${task.retry_count})</span>`;
          }

          let statusDetailText = '';
          if (task.status === 'waiting_answer') {
            statusDetailText = '<div style="font-size: 0.7rem; color: var(--warning); margin-top: 0.1rem; font-weight: 500;">🔔 Escalated to Telegram</div>';
          } else if (task.status === 'running') {
            statusDetailText = `<div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; font-family: monospace;">Session: ${task.jules_session_id || 'starting...'}</div>`;
          }

          card.innerHTML = `
            <div class="task-status-info">
              <h4>${task.title} ${retryContent}</h4>
              <p>ID: ${task.id} ${statusDetailText}</p>
            </div>
            <div class="task-status-actions">
              ${actionContent}
              <span class="badge badge-${task.status}">${task.status}</span>
            </div>
          `;
          listContainer.appendChild(card);
        });

        // Close polling on completion
        if (data.phase.status === 'complete' || data.phase.status === 'failed') {
          clearInterval(pollInterval);
          document.getElementById('polling-health-box').innerText = 'COMPLETED';
          document.getElementById('polling-health-box').style.color = 'var(--neutral)';
        }

      } catch (err) {
        console.error('Status poll failed:', err);
      }
    }

    async function updateQALog() {
      if (!activePhaseId) return;

      try {
        const response = await fetch(`/api/phases/${activePhaseId}/qalog`, {
          headers: getHeaders()
        });
        if (!response.ok) return;

        const logs = await response.json();
        const container = document.getElementById('qalog-list');
        const emptyMsg = document.getElementById('qalog-empty-message');

        if (logs.length === 0) {
          container.innerHTML = '';
          emptyMsg.style.display = 'block';
          return;
        }

        emptyMsg.style.display = 'none';
        container.innerHTML = '';

        logs.forEach(log => {
          const card = document.createElement('div');
          card.className = 'qalog-card';
          
          let confidenceBadge = '';
          if (log.confidence_score !== null) {
            const scoreColor = log.confidence_score >= 7 ? 'var(--success)' : 'var(--warning)';
            confidenceBadge = `<span style="color: ${scoreColor}; font-weight: 600;">Conf: ${log.confidence_score}/10</span>`;
          }

          const timeString = new Date(log.created_at).toLocaleTimeString();

          card.innerHTML = `
            <div class="qalog-header">
              <span>Task: <strong>${log.task_title}</strong></span>
              <span>${timeString}</span>
            </div>
            <div class="qalog-body">
              <div class="qalog-question"><strong>Q:</strong> ${log.jules_question}</div>
              <div class="qalog-answer"><strong>A:</strong> ${log.answer}</div>
            </div>
            <div class="qalog-footer">
              <span>By: <strong class="badge badge-${log.answered_by === 'telegram' ? 'waiting_answer' : 'pr_open'}" style="padding: 0.1rem 0.35rem; font-size: 0.65rem;">${log.answered_by}</strong></span>
              ${confidenceBadge}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('QA Log fetch error:', err);
      }
    }

    function resetToDraft() {
      if (confirm('Exit active phase view? Server execution will continue in the background.')) {
        if (pollInterval) clearInterval(pollInterval);
        if (qaInterval) clearInterval(qaInterval);
        
        activePhaseId = null;
        document.getElementById('phase-active-card').style.display = 'none';
        document.getElementById('phase-creation-card').style.display = 'block';
        
        document.getElementById('polling-health-box').innerText = 'OFFLINE';
        document.getElementById('polling-health-box').style.color = 'var(--neutral)';
        document.getElementById('escalation-count-box').innerText = '0';
        document.getElementById('escalation-count-box').style.color = 'var(--neutral)';
        document.getElementById('escalation-reminder-text').style.display = 'none';
        
        loadFormDraft();
        if (window.innerWidth < 1024) {
          showTab('setup');
        }
      }
    }

    async function loadPhasesList() {
      try {
        const response = await fetch('/api/phases', {
          headers: getHeaders()
        });
        if (!response.ok) return;
        const phases = await response.json();
        
        const selector = document.getElementById('phase-selector');
        selector.innerHTML = '<option value="">-- Load Phase --</option>';
        
        let activePhaseFound = null;
        phases.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.innerText = `${p.title} (${p.status})`;
          selector.appendChild(opt);
          
          if (p.status === 'active' && !activePhaseFound) {
            activePhaseFound = p.id;
          }
        });
        
        // If an active phase is already running in background, auto-load it
        if (activePhaseFound) {
          selector.value = activePhaseFound;
          onPhaseSelect(activePhaseFound);
        }
      } catch (err) {
        console.error('Error loading phases list:', err);
      }
    }

    function onPhaseSelect(phaseId) {
      if (!phaseId) {
        resetToDraft();
        return;
      }
      
      activePhaseId = parseInt(phaseId, 10);
      
      // Hide setup, show active controls
      document.getElementById('phase-creation-card').style.display = 'none';
      document.getElementById('phase-active-card').style.display = 'block';

      loadActivePhase();
      
      if (window.innerWidth < 1024) {
        showTab('status');
      }
    }

    window.addEventListener('load', () => {
      loadFormDraft();
      checkViewport();
      loadPhasesList();
    });
  </script>
</body>
</html>
